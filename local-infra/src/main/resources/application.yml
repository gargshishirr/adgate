server:
  # Chaos switch. It always binds to 127.0.0.1 (LocalOnlyWebConfig), whatever server.address says.
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: local-infra

# Dev only: both listen on 127.0.0.1 and have no password.
local-infra:
  kafka-port: ${KAFKA_PORT:9092}
  redis-port: ${REDIS_PORT:6379}

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    state.change.logger: WARN
    org.apache.kafka.test.TestUtils: OFF
    com.github.fppt.jedismock: WARN
