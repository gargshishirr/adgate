server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: local-infra

local-infra:
  kafka-port: 9092
  redis-port: 6379

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    state.change.logger: WARN
    org.apache.kafka.test.TestUtils: OFF
    com.github.fppt.jedismock: WARN
