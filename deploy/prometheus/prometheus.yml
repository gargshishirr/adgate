global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: eligibility-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eligibility-service:8081"]

  - job_name: spend-aggregator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spend-aggregator:8082"]
