# Full stack with real Kafka and Redis, plus Prometheus and Grafana.
#   cp deploy/.env.example deploy/.env        # then fill in every empty value
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up --build -d
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile sim run --rm traffic-sim
# Every port is published on 127.0.0.1 only. Kafka, Redis and Prometheus have no login, so never publish them
# on a public interface. Grafana: http://localhost:3000 (login from deploy/.env)  Prometheus: http://localhost:9090
name: adgate

services:
  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the services with the partition count and config they need.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      # The internal listener, so the check works whatever host port KAFKA_PORT publishes.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7.4.12-alpine
    # requirepass: every client must log in. The entrypoint still drops root before starting redis-server.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}"]
    environment:
      # Lets redis-cli in the health check log in without putting the password on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  spend-aggregator:
    build:
      context: ..
      args:
        MODULE: spend-aggregator
        HEALTH_PORT: "8082"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Health and metrics only.
      - "127.0.0.1:${AGGREGATOR_PORT:-8082}:8082"

  eligibility-service:
    build:
      context: ..
      args:
        MODULE: eligibility-service
        HEALTH_PORT: "8081"
    environment:
      # prod: refuses to start without strong API keys, and never generates keys.
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
      ADGATE_ADMIN_KEY: ${ADGATE_ADMIN_KEY:?Set ADGATE_ADMIN_KEY in deploy/.env}
      ADGATE_CLIENT_KEY: ${ADGATE_CLIENT_KEY:?Set ADGATE_CLIENT_KEY in deploy/.env}
      # The management port (metrics) must be reachable by Prometheus inside the Compose network.
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ELIGIBILITY_PORT:-8081}:8081"
      - "127.0.0.1:${ELIGIBILITY_MANAGEMENT_PORT:-8181}:8181"

  traffic-sim:
    profiles: ["sim"]
    build:
      context: ..
      args:
        MODULE: traffic-sim
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ELIGIBILITY_URL: http://eligibility-service:8081
      ADGATE_ADMIN_KEY: ${ADGATE_ADMIN_KEY:?Set ADGATE_ADMIN_KEY in deploy/.env}
      ADGATE_CLIENT_KEY: ${ADGATE_CLIENT_KEY:?Set ADGATE_CLIENT_KEY in deploy/.env}
    depends_on:
      eligibility-service:
        condition: service_healthy
      spend-aggregator:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.6.16
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
