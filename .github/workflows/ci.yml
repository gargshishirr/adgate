name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests
        run: chmod +x mvnw && ./mvnw -B -ntp verify

  docker:
    name: Container images and Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Compose file
        run: docker compose -f deploy/docker-compose.yml --profile sim config --quiet
      - name: Build service images
        run: |
          for module in eligibility-service spend-aggregator traffic-sim; do
            docker build --build-arg MODULE=$module -t adgate/$module .
          done
