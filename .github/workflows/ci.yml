name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories for our dependencies show up even when the code does not change.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests
        run: chmod +x mvnw && ./mvnw -B -ntp verify

  playground:
    name: Playground (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test (includes every golden vector from the Java engine)
        run: npm test
      - run: npm run build

  dependency-scan:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.7.1
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: List the shipped dependencies as a CycloneDX SBOM
        run: >-
          chmod +x mvnw && ./mvnw -B -ntp -q -DskipTests package
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DincludeTestScope=false
      - name: Check them against the OSV database
        # Accepted advisories, each with a reason and an end date, are in osv-scanner.toml.
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
          ./osv-scanner scan source --config osv-scanner.toml --lockfile target/bom.json

  docker:
    name: Container images and Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Compose file
        # Placeholder values: Compose refuses to run without the secrets from deploy/.env.
        env:
          ADGATE_ADMIN_KEY: ci-placeholder-admin-key-not-a-secret-0000
          ADGATE_CLIENT_KEY: ci-placeholder-client-key-not-a-secret-000
          REDIS_PASSWORD: ci-placeholder-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-grafana-password
        run: docker compose -f deploy/docker-compose.yml --profile sim config --quiet
      - name: Build service images
        run: |
          for module in eligibility-service spend-aggregator traffic-sim; do
            docker build --build-arg MODULE=$module -t adgate/$module .
          done
